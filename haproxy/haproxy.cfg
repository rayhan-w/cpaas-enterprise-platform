global
    log stdout format raw local0 info
    maxconn 50000
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  3600s

# Rate limiting table (100 requests per 10 seconds per IP)
peers mypeers
    peer local 127.0.0.1:1024

frontend http_front
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/solvear.pem alpn h2,http/1.1

    # Redirect HTTP to HTTPS in production
    # http-request redirect scheme https unless { ssl_fc }

    # Rate Limiting Guard
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 150 }

    # Security Headers
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Route Rules
    acl is_api path_beg /api
    acl is_bot path_beg /bot /ai /webhooks
    acl is_ws  hdr(Upgrade) -i WebSocket

    use_backend api_backend if is_api
    use_backend bot_backend if is_bot
    default_backend web_backend

backend web_backend
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server web_node1 web:3000 check inter 3000ms rise 2 fall 3

backend api_backend
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server api_node1 api:4000 check inter 2000ms rise 2 fall 3

backend bot_backend
    balance roundrobin
    option httpchk GET /health
    server bot_node1 chatbot:5000 check inter 2000ms rise 2 fall 3
