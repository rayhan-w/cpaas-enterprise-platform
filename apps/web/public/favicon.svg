<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Hot Pink to Vibrant Crimson -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Inner Glow for depth -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main Rounded Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Top Glass Highlight -->
  <rect x="28" y="28" width="456" height="220" rx="116" fill="url(#innerGlow)"/>

  <!-- Modern Chat Bubble Tail in bottom right -->
  <path d="M370 410 L430 460 L410 390 Z" fill="#9f1239"/>

  <!-- Iconic Solvear 'S' Symbol (Bold Geometric & Fluid) -->
  <path d="M 330 185 
           C 330 145, 298 125, 256 125 
           C 205 125, 170 152, 170 198 
           C 170 262, 342 242, 342 314 
           C 342 364, 305 387, 256 387 
           C 195 387, 160 350, 160 305" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Small AI Message Sparkle Dot in Top Right -->
  <circle cx="360" cy="150" r="22" fill="#ffffff" filter="url(#dropShadow)"/>
  <circle cx="360" cy="150" r="12" fill="#e11d48"/>
</svg>
