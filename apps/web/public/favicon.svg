<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Brand Leaf Green (#6CAE14 to #4E820C) -->
    <linearGradient id="jmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AC215"/>
      <stop offset="60%" stop-color="#6CAE14"/>
      <stop offset="100%" stop-color="#49790B"/>
    </linearGradient>

    <!-- Leaf accent gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ED114"/>
      <stop offset="100%" stop-color="#6CAE14"/>
    </linearGradient>

    <!-- Drop Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Main Rounded Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#jmBg)" filter="url(#dropShadow)"/>

  <!-- Top Glass Highlight for depth -->
  <rect x="28" y="28" width="456" height="220" rx="116" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Shopping Bag Body (Crisp Pure White) -->
  <path d="M152 208 L360 208 L340 416 L172 416 Z" fill="#ffffff"/>

  <!-- Bag Handles (Curved arch) -->
  <path d="M204 208 V156 C204 128 226 104 256 104 C286 104 308 128 308 156 V208" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="28" 
        stroke-linecap="round"/>

  <!-- Jawata Mart Fresh Green Leaf Motif inside Bag -->
  <path d="M256 244 C216 288 216 340 256 364 C296 340 296 288 256 244 Z" fill="url(#leafGrad)"/>
  <path d="M256 250 L256 358" stroke="#3A6307" stroke-width="6" stroke-linecap="round"/>
</svg>
